[dependencies]
  "sonyflake" = "1.0.9"
  "jsonvalue" = "1.1.0"
  "ystyle::jsonrpc" = "0.7.4"

[package]
  cjc-version = "1.1.0"
  compile-option = "-Woff unused"
  description = "MCP (Model Context Protocol) 服务端框架"
  link-option = "-lstdx.crypto.digest"
  name = "mcp"
  output-type = "static"
  override-compile-option = ""
  src-dir = ""
  target-dir = ""
  version = "2.3.7"
  license = ["MulanPSL-2.0"]
  authors = ["ystyle"]
  repository = "https://atomgit.com/ystyle/mcp-cj"

[package.package-configuration."mcp.examples.basic"]
output-type = "executable"
compile-option = "--static"

[package.package-configuration."mcp.examples.cli"]
output-type = "executable"
compile-option = "--static"

[package.package-configuration."mcp.examples.testclient"]
output-type = "executable"
compile-option = "--static"

[package.package-configuration."mcp.examples.v2025_11_25_streamable_server"]
output-type = "executable"
compile-option = "--static"

[package.package-configuration."mcp.examples.v2025_11_25_streamable_test"]
output-type = "executable"
compile-option = "--static"

[package.package-configuration."mcp.examples.v2025_11_25_notification_test"]
output-type = "executable"
compile-option = "--static"

[package.package-configuration."mcp.examples.v2026_07_28_stateless_test"]
output-type = "executable"
compile-option = "--static"


[target.x86_64-unknown-linux-gnu.bin-dependencies]
path-option = [ "${CANGJIE_STDX_PATH}" ]

[target.x86_64-w64-mingw32.bin-dependencies]
path-option = [ "${CANGJIE_STDX_PATH}" ]

[target.aarch64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
[target.x86_64-linux-ohos.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]
